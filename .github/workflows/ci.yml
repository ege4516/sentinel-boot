name: ci

on:
  push:
  pull_request:

# Same OS image the project was developed on (Ubuntu 22.04: clang 14, CMake 3.22).
jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [host-debug, host-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3-pip
          python3 -m pip install cryptography
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 4

  valgrind:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build valgrind python3-pip
          python3 -m pip install cryptography
      - run: cmake --preset host-debug
      - run: cmake --build --preset host-debug
      - name: Run the end-to-end scenarios under Valgrind
        run: |
          valgrind --error-exitcode=1 --leak-check=full \
            ~/sb-build/host-debug/tests/sb_tests --gtest_filter='Boot.*:BootReject.*:Boundaries/*'

  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy
      - run: cmake --preset host-debug
      - name: clang-tidy
        run: |
          clang-tidy -p ~/sb-build/host-debug --warnings-as-errors='*' \
            boot/*.c hal/*.c tools/sim/main.c

  fuzz:
    name: fuzz (60 s each)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libfuzzer-14-dev
      - run: cmake --preset host-fuzz
      - run: cmake --build --preset host-fuzz
      - name: Fuzz the manifest parser
        run: |
          mkdir -p /tmp/corpus-manifest
          ~/sb-build/host-fuzz/tests/fuzz/fuzz_manifest -max_total_time=60 -max_len=400 \
            /tmp/corpus-manifest tests/fuzz/corpus/manifest
      - name: Fuzz the full update path
        run: |
          mkdir -p /tmp/corpus-update
          ~/sb-build/host-fuzz/tests/fuzz/fuzz_update -max_total_time=60 -max_len=6000 \
            /tmp/corpus-update tests/fuzz/corpus/update

  qemu-cortex-m3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake qemu-system-arm gcc-arm-none-eabi             libnewlib-arm-none-eabi python3-pip
          python3 -m pip install cryptography
      - run: cmake --preset qemu-mps2
      - run: cmake --build --preset qemu-mps2
      - name: Run the self-test on an emulated Cortex-M3
        run: ctest --preset qemu-mps2
      - name: Size report
        run: python3 tools/map_sizes.py ~/sb-build/qemu-mps2/port/qemu_mps2/sb_selftest.map
